# Litestream 0.3.13 — see the pinned version in the Dockerfile. The 0.5 series
# uses a different config schema (LTX files, compaction levels, a `snapshot`
# block); none of those keys are valid here and using them would fail at
# startup. Key names below were checked against the ReplicaConfig struct in the
# v0.3.13 source rather than the current docs, which describe 0.5.
dbs:
  - path: /data/db.sqlite3
    replicas:
      - type: gcs
        bucket: ${LITESTREAM_GCS_BUCKET}
        path: hf/db

        # **This value no longer decides anything.** Kept explicit because
        # deleting it would restore Litestream's 24h default, and because the
        # check below never fires it would be equally inert — but less obviously
        # so to the next reader.
        #
        # The real recovery window is set by `LITESTREAM_KEEP_GENERATIONS`
        # (default 50) in hf/settings/base.py, enforced daily by the
        # prune-generations task. That is a **count**, not a duration: at the
        # 25-33 cold starts/day observed in September 2026 it works out at
        # roughly 36-48 hours, and it shrinks if cold starts become more
        # frequent. So the effective window is shorter than the seven days this
        # line reads as.
        #
        # Why a count: boot time depends on how many generations exist, because
        # `litestream restore` inspects every one of them. An age-based window
        # cannot bound that, and an age-based *lifecycle rule* has a worse
        # property still — it deletes unconditionally, so an idle application
        # loses its whole replica. Keeping the newest N has no such cliff.
        # See core/replica.py and plans/cron-collision-and-boot-regression.md.
        retention: 168h

        # Deliberately longer than any container lives, so this check
        # effectively never fires. **GCS is the pruner**, via the 30-day
        # lifecycle rule on the bucket in terraform/storage.tf. Litestream's
        # retention above is a backstop for the unusual case of a long-lived
        # container, not the primary mechanism.
        #
        # This was 5m from 2026-08-08 to 2026-09-05, and that was expensive.
        #
        # The retention check walks every generation individually, so it costs
        # `generations × checks`. At 252 generations that is roughly 857 LIST
        # calls every five minutes a container happens to be awake. Measured on
        # 2026-09-04:
        #
        #   150,798  ListObjects   ← this setting
        #        88  DeleteObject
        #        74  WriteObject
        #        72  ReadObject
        #
        # At the Class A rate that is about $1.03 CAD/day — $375/year — to prune
        # 2 MiB of snapshots that were costing nothing. The comment this replaces
        # claimed it "costs a handful of LIST calls"; it was never measured.
        #
        # Note what does *not* help: shortening `retention` above. Generation
        # count is 0.1% of the cost, check frequency is the other 99.9%. And do
        # not simply delete these two keys — the defaults are 24h retention with
        # an hourly check, which both restores the cost on any session over an
        # hour and gives a thinner recovery window than the lifecycle rule.
        #
        # Full working: plans/litestream-retention-cost.md
        retention-check-interval: 24h
